# Minimal SearXNG config for Pharos price/product search.
# lib/search.ts calls this instance at /search?format=json — and the JSON API is OFF in the
# stock config, so `search.formats: [html, json]` below is the load-bearing line.
#
# This instance publishes NO ports (see docker-compose.prod.yml): only the `web` container
# reaches it over the compose network. `secret_key` is therefore an internal signing key, not
# an internet-facing secret; it may be rotated with `openssl rand -hex 32` but does not need to
# be. `limiter: false` because the only caller is our own server-side code, not browsers.
use_default_settings: true
server:
  secret_key: "c712a3c832b9c2f1ef52cc682148582223336e00a2ffc916864e23d4d822c250"
  limiter: false
  image_proxy: false
search:
  safe_search: 0
  formats:
    - html
    - json

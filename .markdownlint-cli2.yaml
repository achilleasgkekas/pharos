# markdownlint (CI "Docs" job, #331). Light on purpose: structure that breaks rendering
# (missing blank lines around lists and headings, unlabeled code fences, stray blank lines)
# is checked; style choices the docs make deliberately are not.
config:
  default: true
  MD013: false # line length: prose is wrapped by hand, tables and links run long
  MD033: false # inline HTML: README banners, <details>, <kbd>
  MD041: false # first line heading: READMEs open with a banner image
  MD036: false # emphasis as heading: used for short labelled paragraphs
  MD024:
    siblings_only: true # the same sub-heading under different sections is fine
ignores:
  - '**/node_modules/**'
  - '.github/ISSUE_TEMPLATE/**'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: phk_ token
      description: The user's personal API token (`apiToken`), shared with the MCP connector.

  parameters:
    Id:
      name: id
      in: path
      required: true
      description: 24-character hex Mongo ObjectId.
      schema:
        type: string
        pattern: '^[a-fA-F0-9]{24}$'
    Limit:
      name: limit
      in: query
      description: Page size, clamped to 1..200.
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Offset:
      name: offset
      in: query
      description: Records to skip.
      schema: { type: integer, minimum: 0, default: 0 }
    UpdatedSince:
      name: updatedSince
      in: query
      description: ISO date. Returns only records with `updatedAt >= it`; soft-deleted records are also returned, flagged `deleted:true`.
      schema: { type: string, format: date-time }

  responses:
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: 'Unauthorized — send Authorization: Bearer <token>' }
    Forbidden:
      description: Authenticated but not permitted (admin-only endpoint).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Record not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadInput:
      description: Malformed body or ID.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    OkDeleted:
      description: Deleted.
      content:
        application/json:
          schema:
            type: object
            properties:
              ok: { type: boolean, const: true }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
      required: [error]
    ListMeta:
      type: object
      description: Common pagination envelope fields (data array is added per resource).
      properties:
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
      required: [total, limit, offset]
    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        username: { type: string }
        role: { type: string, enum: [admin, member] }
    LoginResponse:
      type: object
      properties:
        token: { type: string, description: 'Bearer token beginning with phk_.' }
        user: { $ref: '#/components/schemas/User' }
      required: [token, user]
    Item:
      type: object
      description: Item summary. The detail endpoint returns additional fields (links, price history, photos, warranty, purchase, computed price block).
      additionalProperties: true
      properties:
        _id: { type: string }
        title: { type: string }
        status: { type: string }
        category: { type: string }
        currentPrice: { type: number }
        targetPrice: { type: number }
        tags:
          type: array
          items: { type: string }
        updatedAt: { type: string, format: date-time }
        deleted: { type: boolean, description: Present and true only in an updatedSince sync when the record was soft-deleted. }
    ShoppingListItem:
      type: object
      additionalProperties: true
      properties:
        _id: { type: string }
        name: { type: string }
        quantity: { type: number }
        category: { type: string }
        brand: { type: string }
        note: { type: string }
        checked: { type: boolean }
    LineItem:
      type: object
      additionalProperties: true
      properties:
        name: { type: string }
        price: { type: number }
        quantity: { type: number }
        vatRate: { type: number }
    Receipt:
      type: object
      additionalProperties: true
      properties:
        _id: { type: string }
        store: { type: string }
        date: { type: string }
        total: { type: number }
        subtotal: { type: number }
        vatAmount: { type: number }
        paymentMethod: { type: string }
        verified: { type: boolean }
        archived: { type: boolean }
        updatedAt: { type: string, format: date-time }
        deleted: { type: boolean }
    Expense:
      type: object
      additionalProperties: true
      properties:
        _id: { type: string }
        kind: { type: string, enum: [income, expense] }
        vendor: { type: string }
        amount: { type: number }
        category: { type: string }
        date: { type: string }
        period: { type: string }
        recurring: { type: boolean }
        recurringCycle: { type: string }
        paymentMethod: { type: string }
        notes: { type: string }
        updatedAt: { type: string, format: date-time }
        deleted: { type: boolean }
    Statement:
      type: object
      additionalProperties: true
      properties:
        _id: { type: string }
        card: { type: string }
        period: { type: string }
        total: { type: number }
        updatedAt: { type: string, format: date-time }
        deleted: { type: boolean }
    Subscription:
      type: object
      additionalProperties: true
      properties:
        _id: { type: string }
        name: { type: string }
        amount: { type: number }
        billingCycle: { type: string }
        nextRenewal: { type: string }
        category: { type: string }
        provider: { type: string }
        url: { type: string }
        active: { type: boolean }
        updatedAt: { type: string, format: date-time }
        deleted: { type: boolean }
    Voucher:
      type: object
      additionalProperties: true
      properties:
        _id: { type: string }
        title: { type: string }
        code: { type: string }
        store: { type: string }
        discount: { type: string }
        expiresAt: { type: string }
        url: { type: string }
        used: { type: boolean }
        notes: { type: string }
        updatedAt: { type: string, format: date-time }
        deleted: { type: boolean }
    Task:
      type: object
      additionalProperties: true
      properties:
        _id: { type: string }
        title: { type: string }
        status: { type: string, enum: [todo, in-progress, done, blocked] }
        priority: { type: string }
        tags:
          type: array
          items: { type: string }
        content: { type: string }
        dueDate: { type: string }
        updatedAt: { type: string, format: date-time }
        deleted: { type: boolean }
    Notification:
      type: object
      additionalProperties: true
      properties:
        _id: { type: string }
        kind: { type: string }
        title: { type: string }
        body: { type: string }
        href: { type: string }
        read: { type: boolean }
        createdAt: { type: string, format: date-time }

  /bills:
    get:
      tags: [Bills]
      summary: List bills
      description: Soonest due first. Archived bills are excluded unless `archived=1`; `paid=0` returns only unpaid ones.
      parameters:
        - name: archived
          in: query
          schema: { type: string, enum: ['0', '1'] }
        - name: paid
          in: query
          description: '`0` = unpaid only.'
          schema: { type: string, enum: ['0'] }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/UpdatedSince'
      responses:
        '200':
          description: Paginated bills.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListMeta'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Bill' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Bills]
      summary: Create a bill
      description: |
        `amount` is read as the figure printed on the invoice. When `currency` differs from
        the deployment's base currency it is converted with `fxRate` before storage, so the
        stored `amount` is always base currency. Omit both to keep plain single-currency
        behaviour.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, dueDate]
              properties:
                title: { type: string }
                dueDate: { type: string, description: Any parseable date. }
                vendor: { type: string }
                amount: { type: number }
                category: { type: string }
                cycle: { $ref: '#/components/schemas/BillCycle' }
                notes: { type: string }
                space: { type: string, description: 'Per-property ledger tag (P68, #14); trimmed, max 40 chars. Empty = unassigned. A payment that logs an expense copies it.' }
                currency: { type: string, description: Currency code printed on the invoice. }
                fxRate: { type: number, description: Base units per 1 unit of `currency`. }
      responses:
        '201':
          description: Created bill.
          content:
            application/json:
              schema:
                type: object
                properties:
                  bill: { $ref: '#/components/schemas/Bill' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /bills/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Bills]
      summary: Update a bill, or mark it paid/unpaid
      description: |
        Plain field edits and the paid/unpaid transition can be sent in the same request.
        `paid: true` sets `paidAt` (to `paidDate` or now) and, the first time a recurring
        bill (`cycle` set) is paid, spawns the next pending instance one cycle ahead —
        `spawnedNext` says whether that happened. `paid: false` undoes the payment.
        Touching any money field re-resolves `amount`/`currency`/`origAmount`/`fxRate`
        together so a bill is never left half-converted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                vendor: { type: string }
                amount: { type: number }
                dueDate: { type: string }
                category: { type: string }
                cycle: { $ref: '#/components/schemas/BillCycle' }
                notes: { type: string }
                space: { type: string, description: 'Per-property ledger tag (P68, #14); trimmed, max 40 chars. Empty = unassigned. A payment that logs an expense copies it.' }
                archived: { type: boolean }
                paid: { type: boolean }
                paidDate: { type: string }
                currency: { type: string }
                fxRate: { type: number }
      responses:
        '200':
          description: Updated bill.
          content:
            application/json:
              schema:
                type: object
                properties:
                  bill: { $ref: '#/components/schemas/Bill' }
                  spawnedNext: { type: boolean }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Bills]
      summary: Soft-delete a bill
      responses:
        '200': { $ref: '#/components/responses/OkDeleted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }


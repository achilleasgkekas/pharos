                notes: { type: string }
      responses:
        '201':
          description: Created gift card.
          content:
            application/json:
              schema:
                type: object
                properties:
                  giftCard: { $ref: '#/components/schemas/GiftCard' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /giftcards/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Gift cards]
      summary: Update a gift card, or record/undo a use
      description: |
        Field edits, archiving and one balance movement can travel in the same request.
        `addUse` records a spend (positive amount) or a reload (negative amount);
        `removeUseId` undoes a single entry. The two are mutually exclusive (`400` if both
        are sent) because they mutate the same `uses` array.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                store: { type: string }
                code: { type: string }
                initialAmount: { type: number }
                expiresAt: { type: string }
                notes: { type: string }
                archived: { type: boolean }
                addUse:
                  type: object
                  required: [amount]
                  properties:
                    amount: { type: number, description: Non-zero. Positive = spend, negative = reload. }
                    note: { type: string }
                    date: { type: string }
                removeUseId: { type: string }
      responses:
        '200':
          description: Updated gift card.
          content:
            application/json:
              schema:
                type: object
                properties:
                  giftCard: { $ref: '#/components/schemas/GiftCard' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Gift cards]
      summary: Soft-delete a gift card
      responses:
        '200': { $ref: '#/components/responses/OkDeleted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /goals:
    get:
      tags: [Goals]
      summary: List savings goals
      description: Archived goals are excluded unless `archived=1`. Progress fields are derived from contributions and never stored.
      parameters:
        - name: archived
          in: query
          schema: { type: string, enum: ['0', '1'] }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/UpdatedSince'
      responses:
        '200':
          description: Paginated goals.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListMeta'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Goal' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Goals]
      summary: Create a savings goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                targetAmount: { type: number, description: Negatives are clamped to 0. }
                targetDate: { type: string }
                category: { type: string }
                notes: { type: string }
      responses:
        '201':
          description: Created goal.
          content:
            application/json:
              schema:
                type: object
                properties:
                  goal: { $ref: '#/components/schemas/Goal' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /goals/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Goals]
      summary: Update a goal, or add/remove a contribution
      description: |
        Field edits, archiving and one contribution change can travel in the same request.
        `addContribution.amount` must be positive: a goal only ever gains money through
        contributions, and a mistaken entry is undone with `removeContributionId` rather
        than cancelled out by a negative one. The two are mutually exclusive (`400` if both
        are sent).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                targetAmount: { type: number }
                targetDate: { type: string }
                category: { type: string }
                notes: { type: string }
                archived: { type: boolean }
                addContribution:
                  type: object
                  required: [amount]
                  properties:
                    amount: { type: number, description: Must be greater than 0. }
                    note: { type: string }
                    date: { type: string }
                removeContributionId: { type: string }
      responses:
        '200':
          description: Updated goal.
          content:
            application/json:
              schema:
                type: object
                properties:
                  goal: { $ref: '#/components/schemas/Goal' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Goals]
      summary: Soft-delete a goal
      responses:
        '200': { $ref: '#/components/responses/OkDeleted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tasks:
    get:
      tags: [Tasks]
      summary: List tasks
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [todo, in-progress, done, blocked] }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/UpdatedSince'
      responses:
        '200':
          description: Paginated tasks.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListMeta'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Task' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Tasks]
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                status: { type: string, enum: [todo, in-progress, done, blocked] }
                priority: { type: string }
                tags:
                  type: array
                  items: { type: string }
                content: { type: string }
                dueDate: { type: string }
      responses:
        '201':
          description: Created task.
          content:
            application/json:
              schema:
                type: object
                properties:
                  task: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Tasks]
      summary: Update a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                status: { type: string, enum: [todo, in-progress, done, blocked] }
                priority: { type: string }
                tags:
                  type: array
                  items: { type: string }
                content: { type: string }
                dueDate: { type: string }
                steps:
                  type: array
                  description: >-
                    Full replacement of the checklist, not a merge: send the complete list
                    (add, toggle and remove all resolve here). Only `text` and `done` are
                    read; a step with empty text is dropped and ids are re-minted.
                  items:
                    type: object
                    properties:
                      text: { type: string }
                      done: { type: boolean }
      responses:
        '200':
          description: Updated task.
          content:
            application/json:
              schema:
                type: object
                properties:
                  task: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Tasks]
      summary: Soft-delete a task
      responses:
        '200': { $ref: '#/components/responses/OkDeleted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /cards:
    get:
      tags: [Cards]
      summary: List payment cards
      description: Active first, then by name.
      responses:
        '200':
          description: Cards.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Cards]
      summary: Create a payment card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                last4: { type: string }
                bank: { type: string }
                kind: { type: string }
                type: { type: string }
                color: { type: string }
                creditLimit: { type: number }
                notes: { type: string }
      responses:
        '201':
          description: Created card.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /cards/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Cards]
      summary: Update a payment card
      description: Update any create field plus `active` (send just `{ active }` to toggle).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                last4: { type: string }
                bank: { type: string }
                kind: { type: string }
                type: { type: string }
                color: { type: string }
                creditLimit: { type: number }
                notes: { type: string }
                active: { type: boolean }
      responses:
        '200':
          description: Updated card.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Cards]
      summary: Delete a payment card (permanent)
      description: Cards are not soft-deleted.
      responses:
        '200': { $ref: '#/components/responses/OkDeleted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /stores:
    get:
      tags: [Stores]
      summary: List stores
      description: Seeded on first use, sorted by name.
      responses:
        '200':
          description: Stores.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Stores]
      summary: Create a store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                url: { type: string }
                aliases:
                  description: Array of aliases or a comma-separated string.
                  oneOf:
                    - type: array
                      items: { type: string }
                    - type: string
      responses:
        '201':
          description: Created store.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /stores/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Stores]
      summary: Update a store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                url: { type: string }
                aliases:
                  oneOf:
                    - type: array
                      items: { type: string }
                    - type: string
      responses:
        '200':
          description: Updated store.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Stores]
      summary: Delete a store (permanent)
      description: Stores are not soft-deleted.
      responses:
        '200': { $ref: '#/components/responses/OkDeleted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /ai:
    post:
      tags: [AI]
      summary: Natural-language command bar (AI)
      description: '**(AI: commandBar)** Command agent (add expenses/items/tasks, search, overview…). Needs the Anthropic provider. Older turns are trimmed and each message is size-capped.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                messages:
                  type: array
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role: { type: string, enum: [user, assistant] }
                      content: { type: string }
      responses:
        '200':
          description: Agent reply and actions taken.
          content:
            application/json:
              schema:
                type: object
                properties:
                  reply: { type: string }
                  actions:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        summary: { type: string }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /history:
    get:
      tags: [AI]
      summary: AI command-bar history
      description: Saved conversations, newest first. Read-only.
      responses:
        '200':
          description: History.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications:
    get:
      tags: [Notifications]
      summary: List notifications
      description: Newest-unread first (deals / installments / warranties / system).
      responses:
        '200':
          description: Notifications and unread count.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }
                  unread: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Notifications]
      summary: Mark notifications read
      description: 'Body `{ id }` marks one; omit `id` to mark all read.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: string }
      responses:
        '200':
          description: Mark result.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /jobs:
    get:
      tags: [Notifications]
      summary: List background jobs
      description: Recent background AI jobs (running first, then newest). Read-only.
      responses:
        '200':
          description: Jobs.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /settings:
    get:
      tags: [Settings]
      summary: Get app settings
      description: App preferences plus this-month budget usage.
      responses:
        '200':
          description: Settings.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Settings]
      summary: Update app settings
      description: >-
        Update preferences/defaults, ntfy config and/or budgets. Every field is optional and
        applied only when present and valid; a body with no recognised field is a 400. Numeric
        fields are clamped rather than rejected. `multiCurrency` is deliberately NOT writable
        here (it is an install-wide Settings→Money decision), and neither are AI credentials
        (see /settings/ai).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currency: { type: string, description: 'Base currency code, upper-cased and capped at 4 chars. Changes what every stored amount means, it does not convert anything.' }
                defaultVatRate: { type: number, description: Clamped to 0–100. }
                defaultItemView: { type: string, enum: [grid, list], description: Anything other than `list` is read as `grid`. }
                defaultWarrantyMonths: { type: number, description: Clamped to 0–120. }
                warrantyAlertDays: { type: number, description: 'Clamped to 0–730; 0 turns the warranty alert off.' }
                trialAlertDays: { type: number, description: 'Clamped to 0–60; 0 turns the free-trial reminder off (P33).' }
                autoAddStores: { type: boolean }
                ntfyUrl: { type: string }
                ntfyEnabled: { type: boolean }
                budgetRollover: { type: boolean, description: Envelope mode, carries an unspent balance forward (P25). }
                budgets:
                  type: object
                  description: >-
                    Full replacement of the category→limit map, not a merge: a category left
                    out is dropped. Non-numeric and non-positive limits are discarded.
                  additionalProperties: { type: number }
      responses:
        '200':
          description: Updated settings.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /settings/ai:
    get:
      tags: [Settings]
      summary: Get AI configuration
      description: |
        Master switch, resolved provider and model, readiness and the per-feature toggles.
        Readable by any signed-in user (a viewer should be able to see WHY a scan button
        did nothing). Credentials are deliberately never returned: no key, host or base URL
        appears in this response, and they cannot be written through this route either.
        A feature key that is absent from the stored map counts as ON, so a feature added
        by a later release is not silently off on an older install.
      responses:
        '200':
          description: AI configuration.
          content:
            application/json:
              schema:
                type: object
                properties:
                  aiEnabled: { type: boolean }
                  provider: { type: string, enum: [ollama, anthropic, openai, gemini, openrouter, custom] }
                  model: { type: string, description: Model in play for the resolved provider. }
                  visionModel: { type: string, description: Only meaningful on Ollama, sent unconditionally. }
                  ready: { type: boolean, description: 'false when the master switch is off (no probe is run).' }
                  canEdit: { type: boolean, description: Whether this user may PATCH (admin). }
                  features:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        label: { type: string }
                        description: { type: string }
                        area: { type: string }
                        enabled: { type: boolean }
                        status: { type: string, enum: [disabled, no-provider, ready] }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Settings]
      summary: Flip the AI master switch or per-feature toggles
      description: |
        **Admin only** (`403` for member and viewer): AI spends money per call and the
        setting is instance-wide. Unknown feature keys are dropped rather than stored.
        Credentials are not writable here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                aiEnabled: { type: boolean }
                features:
                  type: object
                  additionalProperties: { type: boolean }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /settings/test-notify:
    post:
      tags: [Settings]
      summary: Send a test notification
      description: Send a one-off test to the configured ntfy topic.
      responses:
        '200':
          description: Sent.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /lists:
    get:
      tags: [Settings]
      summary: Get editable taxonomies
      description: Category taxonomies (current values + defaults).
      responses:
        '200':
          description: Taxonomies.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Settings]
      summary: Overwrite one taxonomy
      description: Empty or identical-to-default clears the override.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, values]
              properties:
                key: { type: string }
                values:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Updated taxonomy.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /trash:
    get:
      tags: [Trash]
      summary: List soft-deleted records
      description: Most-recently-deleted first (item/receipt/expense/subscription/voucher/giftcard/loyaltycard/bill/goal/task). Auto-purges entries older than 30 days as a side effect.
      responses:
        '200':
          description: Trash entries.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /trash/{type}/{id}:
    parameters:
      - name: type
        in: path
        required: true
        schema: { type: string, enum: [item, receipt, expense, subscription, voucher, giftcard, loyaltycard, bill, goal, task] }
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Trash]
      summary: Restore a soft-deleted record
      description: Clears `deletedAt`.
      responses:
        '200':
          description: Restored.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Trash]
      summary: Permanently purge a record (admin)
      description: Removes the doc, its files and cross-refs. **Admin only.**
      responses:
        '200': { $ref: '#/components/responses/OkDeleted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: phk_ token
      description: The user's personal API token (`apiToken`), shared with the MCP connector.

  parameters:
    Id:
      name: id
      in: path
      required: true
      description: 24-character hex Mongo ObjectId.
      schema:
        type: string
        pattern: '^[a-fA-F0-9]{24}$'
    Limit:
      name: limit
      in: query
      description: Page size, clamped to 1..200.
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Offset:
      name: offset
      in: query
      description: Records to skip.
      schema: { type: integer, minimum: 0, default: 0 }
    UpdatedSince:
      name: updatedSince
      in: query
      description: ISO date. Returns only records with `updatedAt >= it`; soft-deleted records are also returned, flagged `deleted:true`.
      schema: { type: string, format: date-time }

  responses:
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: 'Unauthorized — send Authorization: Bearer <token>' }
    Forbidden:
      description: Authenticated but not permitted (admin-only endpoint).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Record not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadInput:
      description: Malformed body or ID.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    OkDeleted:
      description: Deleted.
      content:
        application/json:
          schema:
            type: object
            properties:
              ok: { type: boolean, const: true }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
      required: [error]
    ListMeta:
      type: object
      description: Common pagination envelope fields (data array is added per resource).
      properties:
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
      required: [total, limit, offset]
    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        username: { type: string }
        role: { type: string, enum: [admin, member] }
    LoginResponse:
      type: object
      properties:
        token: { type: string, description: 'Bearer token beginning with phk_.' }
        user: { $ref: '#/components/schemas/User' }
      required: [token, user]
    Item:
      type: object
      description: Item summary. The detail endpoint returns additional fields (links, price history, photos, warranty, purchase, computed price block).
      additionalProperties: true
      properties:
        id: { type: string }
        num: { type: string }
        title: { type: string }
        status: { type: string }
        category: { type: string }
        currentPrice: { type: number, description: Always the deployment's base currency. }
        purchasedPrice: { type: number, nullable: true }
        targetPrice: { type: number, nullable: true }
        currency: { type: string, description: Code the item was priced in abroad; empty on an ordinary item. }
        origAmount: { type: number, description: 'Printed anchor price on a foreign purchase; 0 otherwise.' }
        fxRate: { type: number, description: 'Base units per 1 unit of `currency`; 0 = not foreign, or no rate entered yet (then the price fields are still the printed ones and must not be summed as base).' }
        specs: { type: string }
        warrantyUntil: { type: string, format: date-time, nullable: true }
        tags:
          type: array
          items: { type: string }
        photo: { type: string, nullable: true, description: 'First photo path; fetch via GET /api/files/<photo> with the same Bearer token.' }
        updatedAt: { type: string, format: date-time, nullable: true }
        deleted: { type: boolean, description: Present and true only in an updatedSince sync when the record was soft-deleted. }
    ShoppingListItem:
      type: object
      description: 'Shared shape with the web shopping list, which is why the id field is `_id` here and `id` on the REST-native resources.'
      additionalProperties: true
      properties:
        _id: { type: string }
        name: { type: string }
        quantity: { type: string, description: 'Free text, not a number (e.g. "2", "500g", "2 packs").' }
        category: { type: string }
        brand: { type: string }
        note: { type: string }
        checked: { type: boolean }
        aiScanned: { type: boolean, description: True when the entry came from a product-photo scan. }
        restockIntervalDays: { type: integer, nullable: true, description: Days after a purchase before the item returns unchecked. }
        lastRestockedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    LineItem:
      type: object
      additionalProperties: true
      properties:
        name: { type: string, description: The AI-refined name when there is one, else the raw printed name. }
        qty: { type: number }
        price: { type: number, description: Unit price NET of VAT, as stored. }
        vatRate: { type: number }
        category: { type: string, description: "Optional spend category for this line (P64); empty string = untagged." }
    Receipt:
      type: object
      additionalProperties: true
      properties:
        id: { type: string }
        store: { type: string }
        date: { type: string, format: date-time, nullable: true }
        total: { type: number, description: Gross incl. VAT, always the deployment's base currency. }
        subtotal: { type: number }
        vatAmount: { type: number }
        currency: { type: string, description: Code printed on the receipt. }
        origAmount: { type: number, description: 'Printed total on a foreign receipt; 0 otherwise.' }
        fxRate: { type: number, description: 'Base units per 1 unit of `currency`; 0 = not foreign, or no rate entered yet (then `total` is still the printed number and must not be summed as base).' }
        paymentMethod: { type: string }
        warrantyMonths: { type: number }
        space: { type: string, description: 'Per-property ledger tag (P68), same taxonomy as Settings → Spaces; empty = unassigned.' }
        itemCount: { type: integer, description: Derived — number of stored line items. The list endpoint does not inline them; the detail endpoint returns `lineItems`. }
        verified: { type: boolean }
        archived: { type: boolean }
        file: { type: string, nullable: true, description: 'Stored scan path; fetch via GET /api/files/<file> with the same Bearer token.' }
        thumb: { type: string, nullable: true }
        returnDaysLeft: { type: integer, description: 'Derived (PA3) — days left in the store return window. Omitted entirely on an archived receipt and on an updatedSince sync (the cross-doc lookups are skipped there); never stored.' }
        updatedAt: { type: string, format: date-time, nullable: true }
        deleted: { type: boolean }
    SplitEntry:
      type: object
      description: 'One other person who owes you part of the expense (P35). Your own portion is implicit: amount − Σ share.'
      properties:
        name: { type: string, description: Free-form name, not an app account. }
        share: { type: number }
        settled: { type: boolean, description: True once they have paid you back. }
    Expense:
      type: object
      additionalProperties: true
      properties:
        id: { type: string }
        kind: { type: string, enum: [income, expense] }
        vendor: { type: string }
        category: { type: string }
        space: { type: string, description: 'Per-space/per-property ledger tag (P34), e.g. a second home; empty when unassigned.' }
        amount: { type: number, description: Always the deployment's base currency. }
        currency: { type: string, description: Code printed on the document. }
        origAmount: { type: number, description: 'Printed figure on a foreign document; 0 otherwise.' }
        fxRate: { type: number, description: 'Base units per 1 unit of `currency`; 0 = not foreign, or no rate entered yet (then `amount` is still the printed number and must not be summed as base).' }
        date: { type: string, format: date-time, nullable: true }
        period: { type: string }
        recurring: { type: boolean }
        recurringCycle: { type: string }
        paymentMethod: { type: string }
        notes: { type: string }
        file: { type: string, nullable: true, description: 'Stored scan path; fetch via GET /api/files/<file> with the same Bearer token.' }
        thumb: { type: string, nullable: true }
        verified: { type: boolean }
        split:
          type: array
          items: { $ref: '#/components/schemas/SplitEntry' }
        taxDeductible: { type: boolean }
        taxCategory: { type: string }
        anomaly:
          type: integer
          description: 'Derived ±% deviation from this vendor''s median (>30% only, series of ≥3 priced entries). Present only on a full list read — omitted on an updatedSince sync, where the partial slice would skew the median. Never stored.'
        updatedAt: { type: string, format: date-time, nullable: true }
        deleted: { type: boolean }
    Statement:
      type: object
      additionalProperties: true
      properties:
        id: { type: string }
        card: { type: string }
        last4: { type: string }
        period: { type: string }
        statementDate: { type: string, format: date-time, nullable: true }
        dueDate: { type: string, format: date-time, nullable: true }
        totalAmount: { type: number, description: Always the deployment's base currency. }
        minimumPayment: { type: number }
        paidAmount: { type: number }
        currency: { type: string, description: Code printed on the statement. }
        origAmount: { type: number, description: 'Printed total on a foreign statement; 0 otherwise.' }
        fxRate: { type: number, description: 'Base units per 1 unit of `currency`; 0 = not foreign, or no rate entered yet.' }
        txnCount: { type: integer, description: Derived — number of stored transactions. The list endpoint does not inline them; the detail endpoint returns `transactions`. }
        updatedAt: { type: string, format: date-time, nullable: true }
        deleted: { type: boolean }
    Subscription:
      type: object
      additionalProperties: true
      properties:
        id: { type: string }
        name: { type: string }
        provider: { type: string }
        category: { type: string }
        amount: { type: number, description: Always the deployment's base currency. }
        currency: { type: string }
        origAmount: { type: number, description: 'Printed figure on a foreign-billed subscription; 0 otherwise.' }
        fxRate: { type: number, description: 'Base units per 1 unit of `currency`; 0 = not foreign, or no rate entered yet.' }
        billingCycle: { type: string, enum: [monthly, yearly, quarterly, weekly, lifetime] }
        startDate: { type: string, format: date-time, nullable: true }
        nextRenewal: { type: string, format: date-time, nullable: true }
        active: { type: boolean }
        paymentMethod: { type: string }
        url: { type: string }
        notes: { type: string }
        space: { type: string, description: 'Per-property ledger tag (P68), same taxonomy as Settings → Spaces; empty = unassigned.' }
        trialEndsAt: { type: string, format: date-time, nullable: true, description: 'Free-trial end (P33); the cancel-before-charge alert fires `trialAlertDays` before it.' }
        firstChargeAmount: { type: number, description: 'What the first real charge will be when it differs from `amount`; 0 when it does not.' }
        updatedAt: { type: string, format: date-time, nullable: true }
        deleted: { type: boolean }
    Voucher:
      type: object
      additionalProperties: true
      properties:
        id: { type: string }
        title: { type: string }
        code: { type: string }
        store: { type: string }
        discount: { type: string }
        expiresAt: { type: string }
        url: { type: string }
        used: { type: boolean }
        notes: { type: string }
        updatedAt: { type: string, format: date-time }
        deleted: { type: boolean }
    BarcodeFormat:
      type: string
      enum: [CODE128, EAN13, UPC, CODE39]
    LoyaltyCard:
      type: object
      additionalProperties: true
      properties:
        id: { type: string }
        title: { type: string }
        store: { type: string }
        cardNumber: { type: string }
        barcodeFormat: { $ref: '#/components/schemas/BarcodeFormat' }
        notes: { type: string }
        archived: { type: boolean }
        updatedAt: { type: string, format: date-time, nullable: true }
        deleted: { type: boolean }
    BillCycle:
      type: string
      description: Empty string = one-off.
      enum: ['', weekly, monthly, quarterly, yearly]
    Bill:
      type: object
      additionalProperties: true
      properties:
        id: { type: string }
        title: { type: string }
        vendor: { type: string }
        amount: { type: number, description: Always the deployment's base currency. }
        currency: { type: string, description: Code printed on the invoice. }
        origAmount: { type: number, description: 'Printed figure on a foreign bill; 0 otherwise.' }
        fxRate: { type: number, description: 'Base units per 1 unit of `currency`; 0 = not foreign, or no rate entered yet (then `amount` is still the printed number and must not be summed as base).' }
        dueDate: { type: string, format: date-time, nullable: true }
        paidAt: { type: string, format: date-time, nullable: true }
        category: { type: string }
        cycle: { $ref: '#/components/schemas/BillCycle' }
        notes: { type: string }
        space: { type: string, description: 'Per-property ledger tag (P68, #14); trimmed, max 40 chars. Empty = unassigned. A payment that logs an expense copies it.' }
        archived: { type: boolean }
        status:
          type: string
          description: >-
            Urgency, derived from `dueDate` and `paidAt` — never stored. Deliberately
            independent of payment progress: a part-paid bill that is late still reports
            `overdue`. Use `paymentState` for how much of it has been settled.
          enum: [paid, overdue, due-soon, upcoming]
        paidAmount: { type: number, description: 'Sum of the logged instalments, base currency. 0 for a bill paid in one go.' }
        remaining: { type: number, description: 'Still owed (`amount` minus `paidAmount`, never negative). 0 once `paidAt` is set.' }
        paymentState:
          type: string
          description: Payment progress, derived from `amount`, `payments` and `paidAt`.
          enum: [unpaid, partially-paid, paid]
        payments:
          type: array
          description: >-
            Optional manual instalments toward the bill, always in the deployment's base
            currency so `remaining` stays plain subtraction on a foreign-currency bill.
            Empty for an ordinary one-payment bill.
          items: { $ref: '#/components/schemas/BillPayment' }
        updatedAt: { type: string, format: date-time, nullable: true }
        deleted: { type: boolean }
    BillPayment:
      type: object
      properties:
        id: { type: string }
        amount: { type: number, description: Base currency, same denomination as `Bill.amount`. }
        date: { type: string, format: date-time, nullable: true }
        note: { type: string }
    GiftCardUse:
      type: object
      properties:
        id: { type: string }
        amount: { type: number, description: Positive = spend, negative = reload. }
        date: { type: string, format: date-time, nullable: true }
        note: { type: string }
    GiftCard:
      type: object
      additionalProperties: true
      properties:
        id: { type: string }
        title: { type: string }
        store: { type: string }
        code: { type: string }
        initialAmount: { type: number, description: Face value. }
        expiresAt: { type: string, format: date-time, nullable: true }
        archived: { type: boolean }
        notes: { type: string }
        balance: { type: number, description: Derived — face value minus uses. Never stored. }
        spentPct: { type: number, description: Derived. }
        daysLeft: { type: integer, nullable: true, description: 'Derived from `expiresAt`; null when it never expires.' }
        uses:
          type: array
          items: { $ref: '#/components/schemas/GiftCardUse' }
        updatedAt: { type: string, format: date-time, nullable: true }
        deleted: { type: boolean }
    GoalContribution:
      type: object
      properties:
        id: { type: string }
        amount: { type: number }
        date: { type: string, format: date-time, nullable: true }
        note: { type: string }
    Goal:
      type: object
      additionalProperties: true
      properties:
        id: { type: string }
        title: { type: string }
        targetAmount: { type: number }
        targetDate: { type: string, format: date-time, nullable: true }
        category: { type: string }
        notes: { type: string }
        archived: { type: boolean }
        current: { type: number, description: Derived — sum of contributions. Never stored. }
        remaining: { type: number, description: Derived. }
        pct: { type: number, description: Derived. }
        done: { type: boolean, description: Derived. }
        monthsLeft: { type: integer, nullable: true, description: 'Derived from `targetDate`; null without a deadline.' }
        perMonth: { type: number, nullable: true, description: Derived — what still has to be saved each month to land on time. }
        contributions:
          type: array
          items: { $ref: '#/components/schemas/GoalContribution' }
        updatedAt: { type: string, format: date-time, nullable: true }
        deleted: { type: boolean }
    TaskStep:
      type: object
      properties:
        id: { type: string }
        text: { type: string }
        done: { type: boolean }
    Task:
      type: object
      additionalProperties: true
      properties:
        id: { type: string }
        title: { type: string }
        status: { type: string, enum: [todo, in-progress, done, blocked] }
        priority: { type: string }
        tags:
          type: array
          items: { type: string }
        content: { type: string }
        steps:
          type: array
          items: { $ref: '#/components/schemas/TaskStep' }
        dueDate: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time, nullable: true }
        deleted: { type: boolean }
    Notification:
      type: object
      description: 'Shared shape with the web notification feed, which is why the id field is `_id` here and `id` on the REST-native resources.'
      additionalProperties: true
      properties:
        _id: { type: string }
        kind: { type: string }
        title: { type: string }
        body: { type: string }
        href: { type: string }
        read: { type: boolean }
        createdAt: { type: string, format: date-time }

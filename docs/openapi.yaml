  /statements/plans/merge:
    post:
      tags: [Statements]
      summary: Merge two installment plans
      description: |
        Binds every charge of `sourceKey` into `targetKey`, collapsing two differently-worded
        plans for the same purchase (for example `QUEST ONLINE` vs `QUEST ONLINE KALLITHEA`)
        into one payoff. Keys are the `plan.key` values returned by `GET /statements/plans`.
        Future statements follow the binding.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceKey, targetKey]
              properties:
                sourceKey: { type: string }
                targetKey: { type: string }
      responses:
        '200':
          description: Merged.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  moved: { type: integer, description: Charges re-keyed. }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Statements]
      summary: Undo a plan merge
      description: Clears the manual `planKey` on every charge bound to `key`, splitting them back into their own plans.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key: { type: string }
      responses:
        '200':
          description: Unmerged.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  moved: { type: integer }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }


openapi: 3.1.0
info:
  title: Pharos REST API
  version: 1.0.0
  summary: Token-authenticated JSON API for the Pharos personal hub.
  description: |
    Pharos exposes a versioned REST API under `/api/v1`. It is the same API the
    Expo mobile app consumes, and it is stable enough to build your own clients
    or scripts against. Every route runs on the Node.js runtime and talks to the
    same MongoDB as the web app, so anything you change through the API shows up
    in the web UI (and vice versa).

    This document is a machine-readable mirror of `docs/api.md`. Both are derived
    from the route files under `apps/web/src/app/api/v1/`. If a shape here
    disagrees with the code, **the code wins** — please open an issue.

    ## Auth
    Every route requires a bearer token (`Authorization: Bearer phk_…`) except
    `POST /auth/login`, which mints it. The token is the user's `apiToken` and is
    shared with the MCP connector.

    ## List envelope & incremental sync
    Every list (`GET`) endpoint returns `{ data, total, limit, offset }` and
    accepts `limit` (1..200, default 50), `offset` (default 0) and `updatedSince`
    (ISO date). When `updatedSince` is set, soft-deleted records are ALSO
    returned, each flagged `deleted: true`, so a client can sync both changes and
    deletions in one poll. (`/shopping-list` is the one exception: it returns
    `{ items }` without pagination.)

    ## Soft delete
    `DELETE` on Items, Receipts, Expenses/Income, Subscriptions, Vouchers and
    Tasks is a soft delete (recoverable via the Trash endpoints). Cards and Stores
    are removed permanently.

    ## AI-backed endpoints
    Endpoints tagged **(AI)** call the configured AI provider and are gated behind
    a per-feature toggle in Settings. If the feature is off or the provider is
    misconfigured they return a friendly `{ error }` instead of acting.
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.en.html
externalDocs:
  description: Human-readable API reference
  url: https://github.com/AchilleasGekas/pharos/blob/main/docs/api.md
servers:
  - url: http://localhost:3000/api/v1
    description: Local LAN / dev
  - url: https://{host}/api/v1
    description: Reverse-proxied HTTPS host
    variables:
      host:
        default: pharos.example.com
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Obtain a bearer token.
  - name: Dashboard
    description: Overview, reports, calendar and global search.
  - name: Items
    description: Inventory and shopping items, price tracking, installment links.
  - name: Shopping list
    description: Lightweight household shopping list.
  - name: Receipts
    description: Parsed receipts and their line items.
  - name: Scan
    description: AI capture of receipts, products, bills and vouchers.
  - name: Expenses
    description: Expenses and income.
  - name: Statements
    description: Credit-card statements and installment plans.
  - name: Subscriptions
    description: Recurring subscriptions.
  - name: Vouchers
    description: Discount vouchers and coupons.
  - name: Tasks
    description: Planner tasks.
  - name: Cards
    description: Payment cards.
  - name: Stores
    description: Known stores / vendors.
  - name: AI
    description: Natural-language command bar and history.
  - name: Notifications
    description: In-app notifications, background jobs and push tokens.
  - name: Settings
    description: App preferences and editable taxonomies.
  - name: Trash
    description: Soft-deleted records — list, restore, purge.

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in and mint a bearer token
      description: The only unauthenticated endpoint. Returns the user's stable `phk_` API token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Token and user profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /overview:
    get:
      tags: [Dashboard]
      summary: Headline dashboard counts
      description: Counts (items, shopping list, receipts, expenses, subscriptions, open tasks) plus installments owed, active plan count and currency. For a mobile dashboard.
      responses:
        '200':
          description: Overview object.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401': { $ref: '#/components/responses/Unauthorized' }

  /reports:
    get:
      tags: [Dashboard]
      summary: Money summary
      description: Net position, this month/year, by-category and the last 6 months.
      responses:
        '200':
          description: Reports object.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401': { $ref: '#/components/responses/Unauthorized' }

  /calendar:
    get:
      tags: [Dashboard]
      summary: 3-month money agenda
      description: Subscription renewals (stepped per cycle), card installments aggregated per month, projected recurring bills/income, warranty + voucher expiries, per-month in/out totals, plus a flat `events` array for backward compatibility.
      responses:
        '200':
          description: Calendar agenda.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401': { $ref: '#/components/responses/Unauthorized' }

  /search:
    get:
      tags: [Dashboard]
      summary: Global search
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
          description: Search query.
      responses:
        '200':
          description: Search hits.
          content:
            application/json:
              schema:
                type: object
                properties:
                  hits:
                    type: array
                    items:
                      type: object
                      properties:
                        type: { type: string }
                        id: { type: string }
                        title: { type: string }
                        subtitle: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /items:
    get:
      tags: [Items]
      summary: List items
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [shopping, inventory, all] }
          description: Filter by lifecycle bucket.
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/UpdatedSince'
      responses:
        '200':
          description: Paginated items.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListMeta'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Item' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Items]
      summary: Create an item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                status: { type: string }
                category: { type: string }
                currentPrice: { type: number }
      responses:
        '201':
          description: Created item.
          content:
            application/json:
              schema:
                type: object
                properties:
                  item: { $ref: '#/components/schemas/Item' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /items/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Items]
      summary: Item detail
      description: Full detail (links, price history, photos, warranty, purchase) plus a computed `price` block (best-now, lowest/highest, trend, verdict, where-to-buy) for the mobile price panel.
      responses:
        '200':
          description: Item detail.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Items]
      summary: Update an item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                status: { type: string }
                category: { type: string }
                currentPrice: { type: number }
                targetPrice: { type: number }
                specs: { type: string }
                tags:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Updated item.
          content:
            application/json:
              schema:
                type: object
                properties:
                  item: { $ref: '#/components/schemas/Item' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Items]
      summary: Soft-delete an item
      responses:
        '200': { $ref: '#/components/responses/OkDeleted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /items/import:
    post:
      tags: [Items]
      summary: Import an item from a URL (AI)
      description: '**(AI: itemsImport)** Fetch a product page, AI-parse it, then add or merge into the library.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri }
                view: { type: string, enum: [shopping, inventory], default: shopping }
      responses:
        '200':
          description: Imported or merged.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  id: { type: string }
                  title: { type: string }
                  price: { type: number }
                  store: { type: string }
                  updated: { type: boolean }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /items/{id}/ai-fill:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Items]
      summary: AI-fill item specs/info
      description: '**(AI: itemsImport)** Fill specs/category/tags from the item''s links or a web search.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode: { type: string, enum: [specs, info], default: specs }
      responses:
        '200':
          description: Fill result.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /items/{id}/price:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Items]
      summary: Log an observed price
      description: Appends to the item's price history and updates `currentPrice`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [price]
              properties:
                price: { type: number }
                store: { type: string }
      responses:
        '200':
          description: Updated item.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /items/{id}/convert-to-task:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Items]
      summary: Convert an item into a task
      description: Creates a Task seeded from this item (title, price, links, tag `shopping`). The item is left untouched.
      responses:
        '200':
          description: Created task.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /items/{id}/plans:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Items]
      summary: Installment plans for an item
      description: Installment plans across all statements, each flagged `linked` for this item. Linked first, then active, then by soonest payoff.
      responses:
        '200':
          description: Plans list.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /items/{id}/link-plan:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Items]
      summary: Link an item to an installment plan
      description: Attaches this item to a plan (additive).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signature]
              properties:
                signature: { type: string }
      responses:
        '200':
          description: Link result.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Items]
      summary: Unlink an item from a plan
      description: Detaches this item from a plan, keeping other linked products.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signature]
              properties:
                signature: { type: string }
      responses:
        '200':
          description: Unlink result.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /shopping-list:
    get:
      tags: [Shopping list]
      summary: List shopping-list items
      responses:
        '200':
          description: Shopping list items (not paginated).
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ShoppingListItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Shopping list]
      summary: Add a shopping-list item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                quantity: { type: number }
                category: { type: string }
                brand: { type: string }
                note: { type: string }
      responses:
        '201':
          description: Updated list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ShoppingListItem' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /shopping-list/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Shopping list]
      summary: Update a shopping-list item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                checked: { type: boolean }
                name: { type: string }
                quantity: { type: number }
                category: { type: string }
                brand: { type: string }
                note: { type: string }
      responses:
        '200':
          description: Updated list.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Shopping list]
      summary: Remove a shopping-list item
      responses:
        '200': { $ref: '#/components/responses/OkDeleted' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /receipts:
    get:
      tags: [Receipts]
      summary: List receipts
      parameters:
        - name: store
          in: query
          schema: { type: string }
        - name: archived
          in: query
          schema: { type: string, enum: ['0', '1'] }
          description: '`1` returns archived receipts.'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/UpdatedSince'
      responses:
        '200':
          description: Paginated receipts.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListMeta'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Receipt' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /receipts/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Receipts]
      summary: Receipt detail
      description: Receipt plus its line items.
      responses:
        '200':
          description: Receipt with line items.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Receipts]
      summary: Update a receipt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                store: { type: string }
                date: { type: string }
                total: { type: number }
                subtotal: { type: number }
                vatAmount: { type: number }
                paymentMethod: { type: string }
                notes: { type: string }
                verified: { type: boolean }
                archived: { type: boolean }
                lineItems:
                  type: array
                  items: { $ref: '#/components/schemas/LineItem' }
      responses:
        '200':
          description: Updated receipt.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /receipts/{id}/rescan:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Receipts]
      summary: Re-scan a stored receipt (AI)
      description: '**(AI)** Re-run the parse on the stored file. Returns the same shape as `GET /receipts/{id}` plus `aiUsed`/`model`/`aiError`.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ocr: { type: boolean, description: Force OCR. }
      responses:
        '200':
          description: Re-parsed receipt.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /receipts/{id}/add-to-library:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Receipts]
      summary: Add receipt line items to inventory
      description: Turns line items into inventory Items (find-or-create by title, link the receipt).
      responses:
        '200':
          description: Add result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  created: { type: integer }
                  linked: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /scan/receipt:
    post:
      tags: [Scan]
      summary: Scan and persist a receipt (AI)
      description: '**(AI)** Saves the uploaded file, parses it and creates the receipt. This endpoint **persists**.'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: Image or PDF. }
      responses:
        '201':
          description: Created receipt.
          content:
            application/json:
              schema:
                type: object
                properties:
                  receipt: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /scan/product:
    post:
      tags: [Scan]
      summary: Scan a product image (AI)
      description: '**(AI)** Parse a product image. No save.'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Parsed product.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      name: { type: string }
                      brand: { type: string }
                      category: { type: string }
                      quantity: { type: number }
                      notes: { type: string }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /scan/expense:
    post:
      tags: [Scan]
      summary: Scan a bill/payslip (AI)
      description: '**(AI: expenses)** Provide JSON `{ text }` or a multipart `file`. No save.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Parsed expense.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /scan/voucher:
    post:
      tags: [Scan]
      summary: Scan a voucher (AI)
      description: '**(AI: vouchers)** Provide JSON `{ text }` or a multipart `file`. No save.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Parsed voucher.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /expenses:
    get:
      tags: [Expenses]
      summary: List expenses/income
      parameters:
        - name: kind
          in: query
          schema: { type: string, enum: [income, expense] }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/UpdatedSince'
      responses:
        '200':
          description: Paginated expenses.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListMeta'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Expense' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Expenses]
      summary: Create an expense/income
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vendor, amount]
              properties:
                kind: { type: string, enum: [income, expense] }
                vendor: { type: string }
                amount: { type: number }
                date: { type: string }
                category: { type: string }
                period: { type: string }
                recurring: { type: boolean }
                recurringCycle: { type: string }
                notes: { type: string }
      responses:
        '201':
          description: Created expense.
          content:
            application/json:
              schema:
                type: object
                properties:
                  expense: { $ref: '#/components/schemas/Expense' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /expenses/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Expenses]
      summary: Update an expense/income
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                vendor: { type: string }
                amount: { type: number }
                category: { type: string }

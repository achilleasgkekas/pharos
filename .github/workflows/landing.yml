name: Landing

# The marketing site ships to the same host as the app but had no gate at all: a type error there
# was only found when the image failed to build during a deploy (#136).
on:
  push:
    branches: [main]
    paths: ['apps/landing/**', '.github/workflows/landing.yml']
  pull_request:
    paths: ['apps/landing/**', '.github/workflows/landing.yml']
  workflow_dispatch:

concurrency:
  group: landing-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Read-only token: these jobs only check out and build.
permissions:
  contents: read

jobs:
  build:
    name: Type-check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/landing
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/landing/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run build
      # Lighthouse budgets (#331): performance, accessibility, best practices and SEO on the built
      # site, median of 3 runs. Thresholds and the audits that only warn are in lighthouserc.json;
      # the HTML reports are uploaded for a look when a score drops.
      - name: Lighthouse CI
        run: |
          cp -r .next/static .next/standalone/.next/
          cp -r public .next/standalone/
          npx --yes @lhci/cli@0.15.1 autorun
        env:
          PORT: '3100'
          HOSTNAME: 127.0.0.1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-landing
          path: apps/landing/.lighthouseci/
          retention-days: 14
          if-no-files-found: ignore

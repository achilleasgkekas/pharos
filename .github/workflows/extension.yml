name: Extension

# Its own workflow, with a path filter, for the same reason landing/scraper have theirs: the
# browser extension shares no code with apps/web, so a web-only change used to start a second
# runner — checkout, node, a manifest check — to prove nothing. Almost all of this repo's
# changes are web-only, so almost all of those runs were waste (#136 is about the same bill).
on:
  push:
    branches: [main]
    paths: ['apps/extension/**', '.github/workflows/extension.yml']
  pull_request:
    paths: ['apps/extension/**', '.github/workflows/extension.yml']
  workflow_dispatch:

concurrency:
  group: extension-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  extension:
    name: Browser extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/extension
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # No dependencies and no build step: the source is what the browser runs.
      # `node --test` covers the pure helpers plus the service-worker wiring.
      - run: npm test
      - name: Manifest is valid JSON and points at files that exist
        run: |
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            const refs = [m.background.service_worker, m.options_ui.page, ...Object.values(m.icons)];
            for (const r of refs) if (!fs.existsSync(r)) throw new Error('missing file: ' + r);
            if (m.manifest_version !== 3) throw new Error('expected MV3');
          "

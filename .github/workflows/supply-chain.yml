name: Supply chain

# Dependency and secret checks on every PR (#331). The weekly Semgrep report (security.yml)
# covers our own code; this covers what we pull in and what we might accidentally push out.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: '41 4 * * 1' # Monday: new advisories land without any commit of ours
  workflow_dispatch:

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  audit:
    name: npm audit (${{ matrix.pkg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [apps/web, apps/landing, services/scraper]
    defaults:
      run:
        working-directory: ${{ matrix.pkg }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Production dependencies only, high and critical only: a dev-only advisory in a test tool
      # cannot reach a running instance, and failing on those would train people to ignore red.
      - run: npm audit --omit=dev --audit-level=high

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Blocks a PR that ADDS a dependency with a high-severity advisory or a licence that
      # cannot ship inside an AGPL-3.0 app.
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          deny-licenses: SSPL-1.0, BUSL-1.1
          comment-summary-in-pr: on-failure

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: gitleaks
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          # A PR scans only its own commits; main and the schedule scan the last 50.
          if [ "$EVENT" = "pull_request" ]; then range="origin/$BASE_REF..HEAD"; else range="-50"; fi
          ./gitleaks git --no-banner --redact --log-opts="$range" .

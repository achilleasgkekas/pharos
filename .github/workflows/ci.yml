name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Type-check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run build
        env:
          # Placeholders so the build never reads a real secret; these are only
          # consumed at runtime, not during `next build`.
          AUTH_SECRET: ci-placeholder-secret-do-not-use-in-production
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ci-placeholder-encryption-key-000000

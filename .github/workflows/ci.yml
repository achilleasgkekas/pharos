name: CI

on:
  push:
    branches: [main]
    # Markdown-only commits (the routines write PROGRESS.md / SAAS_PROGRESS.md daily) cannot break
    # the build, and running the full gate on them was a large slice of the monthly Actions minutes
    # (#136). docs/openapi.yaml is NOT excluded: a route test reads it.
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
  # Lets a human (or `gh workflow run CI`) re-run the gate on demand — e.g. to confirm
  # the pipeline is alive after it has been disabled, without pushing a dummy commit.
  workflow_dispatch:

# One run per branch/PR: a new push cancels the stale run instead of queueing behind it.
# `main` is excluded from cancellation so a deploy-triggering run always finishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Type-check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm test
      # ESLint was its own workflow for a while, which meant a second runner doing its own
      # checkout and its own `npm ci` — about 80 seconds of setup to spend 15 on the actual lint,
      # on every push and every PR. Here it reuses the install that is already on disk. It runs
      # AFTER the tests and BEFORE the build so a lint error is reported once the informative
      # checks have had their say, without paying for the slowest step first.
      - run: npm run lint
      - run: npm run build
        env:
          # Placeholders so the build never reads a real secret; these are only
          # consumed at runtime, not during `next build`.
          AUTH_SECRET: ci-placeholder-secret-do-not-use-in-production
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ci-placeholder-encryption-key-000000

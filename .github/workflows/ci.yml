name: CI

on:
  push:
    branches: [main]
  # Every PR, docs-only included: the `changes` job decides what actually runs, and a job that is
  # skipped by its `if` reports success, so the required "Type-check & build" check is satisfied
  # on a Markdown-only PR instead of never appearing (which forced an admin bypass).
  pull_request:
  # Merge queue: the queue tests each PR on top of the ones ahead of it, so two green PRs that
  # conflict semantically cannot both land. The `changes` job treats it like main (run everything).
  merge_group:
  # Lets a human (or `gh workflow run CI`) re-run the gate on demand — e.g. to confirm
  # the pipeline is alive after it has been disabled, without pushing a dummy commit.
  workflow_dispatch:
  # Nightly full run on main: catches breakage that arrives without a commit (a dependency
  # yanked, a base image changed, a date-sensitive test).
  schedule:
    - cron: '23 3 * * *'

# One run per branch/PR: a new push cancels the stale run instead of queueing behind it.
# `main` is excluded from cancellation so a deploy-triggering run always finishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Read-only token: these jobs only check out, build and test. (`nightly-report` asks for more.)
permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.f.outputs.code }}
      docker: ${{ steps.f.outputs.docker }}
      docs: ${{ steps.f.outputs.docs }}
      workflows: ${{ steps.f.outputs.workflows }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            files=$(git diff --name-only "origin/$BASE_REF...HEAD")
          else
            files=ALL
          fi
          printf 'Changed files:\n%s\n' "$files"
          has() { [ "$files" = ALL ] || printf '%s\n' "$files" | grep -Eq "$1"; }
          out() { if has "$2"; then echo "$1=true"; else echo "$1=false"; fi >> "$GITHUB_OUTPUT"; }
          # Anything that is not Markdown can affect the app (openapi.yaml is read by route tests).
          if [ "$files" = ALL ] || printf '%s\n' "$files" | grep -Evq '\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          out docker '^(apps/web/|docker-compose|scripts/mongo-init\.js|searxng/|\.github/ci/|\.github/workflows/ci\.yml)'
          out docs '(\.md$|^docs/|^scripts/check-doc-links\.py$|^\.github/workflows/ci\.yml$|^\.markdownlint-cli2\.yaml$|^_typos\.toml$|^apps/web/src/lib/i18n/locales/en\.ts$)'
          out workflows '^\.github/(workflows/|zizmor\.yml$)'

  build:
    name: Type-check & build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # download main's ci-baseline artifact
      pull-requests: read # list the PR's changed files for the coverage comparison
    defaults:
      run:
        working-directory: apps/web
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Reject private operational files
        run: python3 ../../scripts/check-public-source.py
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run type-check
      # The tests run with coverage on so the report comes for free; it is uploaded below and
      # summarised on the run page. Report-only for now: no threshold fails the job.
      - run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: |
          [ -f coverage/coverage-summary.json ] || exit 0
          jq -r '.total | "### Unit test coverage (apps/web)\n\n| | % | covered |\n| --- | --- | --- |",
            (["lines", "statements", "functions", "branches"][] as $k | "| \($k) | \(.[$k].pct)% | \(.[$k].covered) / \(.[$k].total) |")' \
            coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
      # The parts unit tests mock (soft-delete plugin, the single-database guard, every model's
      # indexes, backup export -> restore), against the MongoDB service. See vitest.integration.config.ts.
      - run: npm run test:integration
        env:
          MONGO_URI: mongodb://127.0.0.1:27017
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-web
          path: apps/web/coverage/
          retention-days: 14
          if-no-files-found: ignore
      # ESLint was its own workflow for a while, which meant a second runner doing its own
      # checkout and its own `npm ci` — about 80 seconds of setup to spend 15 on the actual lint,
      # on every push and every PR. Here it reuses the install that is already on disk. It runs
      # AFTER the tests and BEFORE the build so a lint error is reported once the informative
      # checks have had their say, without paying for the slowest step first.
      # `npm run lint` carries `--max-warnings`: a ratchet, so the warning count can only go down.
      # When you remove warnings, lower the number in package.json to lock the gain in.
      - run: npm run lint
      # Unused files, exports and dependencies (knip). Report-only for now: the backlog is listed
      # on the run page to be worked down, then this becomes a gate.
      - name: Dead code report (knip)
        run: |
          { echo '### Unused code (knip, report-only)'; echo '```'; npx --yes knip@5.88.1 --no-progress --reporter compact || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build
        env:
          # Placeholders so the build never reads a real secret; these are only
          # consumed at runtime, not during `next build`.
          AUTH_SECRET: ci-placeholder-secret-do-not-use-in-production
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ci-placeholder-encryption-key-000000
      # Coverage of the changed files and the client JS size, against the last green run on main
      # (its `ci-baseline` artifact). Fails when a changed file loses coverage or the JS grows past
      # the budget; see scripts/ci/baseline.mjs for the thresholds.
      - name: Measure client JS
        run: node ../../scripts/ci/baseline.mjs bundle .next "$RUNNER_TEMP/bundle.json"
      - name: Compare with main (coverage of changed files, bundle size)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          base="$RUNNER_TEMP/baseline"
          mkdir -p "$base"
          run_id=$(gh run list --workflow CI --branch main --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$run_id" ]; then gh run download "$run_id" --name ci-baseline --dir "$base" || echo "main run $run_id has no ci-baseline artifact"; fi
          gh api "repos/$GH_REPO/pulls/$PR/files" --paginate --jq '.[].filename' > "$RUNNER_TEMP/changed.txt"
          node ../../scripts/ci/baseline.mjs compare "$base" coverage/coverage-summary.json "$RUNNER_TEMP/bundle.json" "$RUNNER_TEMP/changed.txt" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish the baseline (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p "$RUNNER_TEMP/ci-baseline"
          cp coverage/coverage-summary.json "$RUNNER_TEMP/bundle.json" "$RUNNER_TEMP/ci-baseline/"
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: ci-baseline
          path: ${{ runner.temp }}/ci-baseline/
          retention-days: 30
      # Smoke + browser test against the build that was just made, with a real MongoDB: the
      # production server must start, and every main page must render for a fresh admin.
      - name: Start the production server
        run: |
          cp -r .next/static .next/standalone/.next/
          cp -r public .next/standalone/
          mkdir -p "$RUNNER_TEMP/storage"
          (cd .next/standalone && nohup node server.js > "$RUNNER_TEMP/server.log" 2>&1 &)
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/login || true)
            [ "$code" != "000" ] && echo "server up ($code)" && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/server.log"; exit 1
        env:
          PORT: '3000'
          HOSTNAME: 127.0.0.1
          MONGO_URI: mongodb://127.0.0.1:27017/pharos_ci
          STORAGE_ROOT: ${{ runner.temp }}/storage
          AUTH_SECRET: ci-placeholder-secret-do-not-use-in-production
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ci-placeholder-encryption-key-000000
      - name: Browser smoke test (setup + every page)
        run: |
          npm install --no-save playwright@1 @axe-core/playwright@4
          npx playwright install --with-deps chromium
          node e2e/smoke.mjs
        env:
          BASE_URL: http://127.0.0.1:3000
      # The critical paths through the real UI (item, expense, bill paid -> expense, fuel fill ->
      # expense, backup export -> restore), then axe on the key pages. Needs the account smoke made.
      - name: E2E flows and accessibility
        run: node e2e/flows.mjs
        env:
          BASE_URL: http://127.0.0.1:3000
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-failures
          path: apps/web/e2e-failure-*.png
          retention-days: 7
          if-no-files-found: ignore
      - name: Server log
        if: failure()
        run: cat "$RUNNER_TEMP/server.log" || true

  docker:
    name: Docker image builds
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Build only (never pushed): catches Dockerfile / native-dependency breakage (sharp,
      # poppler, tesseract) on the PR instead of at release time.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: false
          load: true
          tags: pharos-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The stack as a self-hoster runs it: docker-compose.yml (MongoDB with auth and its init
      # script, SearXNG, the storage volume) with generated secrets, then the browser smoke test
      # does first-run setup through /setup and opens every page.
      - name: Compose stack starts
        run: |
          {
            echo "AUTH_SECRET=$(openssl rand -hex 32)"
            echo "NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "MONGO_PASS=$(openssl rand -hex 16)"
          } > .env
          docker compose -f docker-compose.yml -f .github/ci/compose.ci.yml up -d --no-build --wait web
          for _ in $(seq 1 45); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/login || true)
            if [ "$code" = "200" ] || [ "$code" = "307" ]; then echo "stack serves /login ($code)"; exit 0; fi
            sleep 2
          done
          exit 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Browser smoke test against the compose stack
        run: |
          mkdir -p "$RUNNER_TEMP/e2e" && cp apps/web/e2e/smoke.mjs "$RUNNER_TEMP/e2e/"
          cd "$RUNNER_TEMP/e2e"
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium
          node smoke.mjs
        env:
          BASE_URL: http://127.0.0.1:3000
      - name: Compose logs
        if: failure()
        run: docker compose -f docker-compose.yml -f .github/ci/compose.ci.yml logs --no-color --tail 200
      # Container scan of the image just built. Blocks only on a CRITICAL vulnerability that has
      # a fix available (so bumping the base image or the package resolves it). HIGH findings are
      # listed on the run page: several sit in the npm CLI bundled with node:24-alpine, which we
      # cannot fix from here and which never runs in the container.
      - name: Trivy (image scan)
        run: |
          curl -sSfL https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz | tar xz trivy
          ./trivy image --quiet --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL \
            --format table --output trivy.txt pharos-web:ci
          { echo '### Trivy: HIGH and CRITICAL with a fix available'; echo '```'; cat trivy.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          ./trivy image --quiet --scanners vuln --ignore-unfixed --severity CRITICAL --exit-code 1 pharos-web:ci

  docs:
    name: Docs links
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 scripts/check-doc-links.py
      # The OpenAPI document must be valid OpenAPI 3.1 (the route tests only compare its paths
      # and fields with the code, not its structure). Warnings (e.g. missing operationId) do
      # not fail the job.
      - name: OpenAPI lint (redocly)
        run: npx --yes @redocly/cli@2.54.3 lint docs/openapi.yaml --format=github-actions
      # Structure that breaks rendering (config: .markdownlint-cli2.yaml) and misspellings in the
      # docs and the English UI copy (config: _typos.toml).
      - name: markdownlint
        run: npx --yes markdownlint-cli2@0.18.1 "**/*.md"
      - name: Spelling (typos)
        run: |
          curl -sSfL https://github.com/crate-ci/typos/releases/download/v1.50.2/typos-v1.50.2-x86_64-unknown-linux-musl.tar.gz | tar xz ./typos
          git ls-files -z '*.md' | xargs -0 ./typos --format brief apps/web/src/lib/i18n/locales/en.ts

  actionlint:
    name: Workflow lint
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
      # zizmor: workflow security lint (template injection, over-broad permissions, unpinned
      # third-party actions, credential persistence). Policy in .github/zizmor.yml.
      - name: zizmor
        run: |
          pipx run zizmor==1.30.1 --offline --config .github/zizmor.yml --min-severity medium \
            --format github .github/workflows

  # One check to mark as required in branch protection / the merge queue. It runs on every PR
  # (docs-only included) and fails if any job the change selected failed or was cancelled, so a
  # red Docker build or docs check blocks the merge too, not only "Type-check & build". A job
  # the paths filter skipped counts as passing.
  ci-passed:
    name: CI passed
    if: always()
    needs: [changes, build, docker, docs, actionlint]
    runs-on: ubuntu-latest
    steps:
      - env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          if [ "$FAILED" = "true" ]; then echo "A required CI job failed or was cancelled."; exit 1; fi
          echo "All selected CI jobs passed."

  # The nightly run has no PR to turn red, so a failure there would go unnoticed. Keep ONE open
  # issue for it (like security.yml does for Semgrep): opened on the first failure, commented on
  # while it keeps failing, closed by the first green night.
  nightly-report:
    name: Nightly report
    if: always() && github.event_name == 'schedule'
    needs: [changes, build, docker, docs, actionlint]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="[ci] Nightly run on main is failing"
          EXISTING=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ "$RESULT" = "success" ]; then
            if [ -n "$EXISTING" ]; then gh issue close "$EXISTING" --comment "Green again: $RUN_URL"; fi
            exit 0
          fi
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Still failing ($(date -u +%F)): $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "The nightly CI run on \`main\` failed ($(date -u +%F)): $RUN_URL

          This issue is kept up to date by the \`Nightly report\` job in ci.yml and closes itself on the next green run."
          fi

name: Release image

# Build and publish the web image to GitHub Container Registry (GHCR).
# Triggers:
#   - push a semver tag (v1.2.3)  → publishes :1.2.3, :1.2, :1, :latest
#   - manual run (workflow_dispatch) → publishes :edge (no :latest move)
# GHCR auth uses the built-in GITHUB_TOKEN — no extra secrets to configure.
# Pull the result with:  docker pull ghcr.io/achilleasgkekas/pharos:latest

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  publish:
    name: Build & push web image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # required to push to GHCR
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action lowercases the image name and derives semver tags.
      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}

      # Dev runs on Apple Silicon (arm64); prod target (Proxmox/x86) is amd64.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

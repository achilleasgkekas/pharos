name: Release image

# Build and publish the web image to GitHub Container Registry (GHCR).
# Triggers:
#   - push a semver tag (v1.2.3)  → publishes :1.2.3, :1.2, :1, :latest
#   - manual run (workflow_dispatch) → publishes :edge (no :latest move)
# GHCR auth uses the built-in GITHUB_TOKEN — no extra secrets to configure.
# Third-party actions are pinned to a commit SHA (this job holds a package-write token);
# Dependabot bumps the SHA and the version comment together.
# Pull the result with:  docker pull ghcr.io/achilleasgkekas/pharos:latest

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  publish:
    name: Build & push web image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # required to push to GHCR
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action lowercases the image name and derives semver tags.
      - name: Derive tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}

      # Dev runs on Apple Silicon (arm64); prod target (Proxmox/x86) is amd64.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build & push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # Stamp the image with the version it is being published as, so the running
          # app can tell the user which release they are on and whether a newer one
          # exists (P40). A manual (edge) run has no semver, so it stays `dev`.
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version || 'dev' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

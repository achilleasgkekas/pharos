name: Lint

# Its own workflow, with a path filter, so a PR that only touches the landing page or the scraper
# does not spend Actions minutes linting the web app (#136 — the free tier is 2000 min/month and
# this repo was already using about half of it).
on:
  push:
    branches: [main]
    paths: ['apps/web/**', '.github/workflows/lint.yml']
  pull_request:
    paths: ['apps/web/**', '.github/workflows/lint.yml']
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  eslint:
    name: ESLint (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      # Errors fail the build; the ~90 known warnings (mostly deliberate `any` in test doubles)
      # are printed so the debt stays visible without blocking anyone. See eslint.config.mjs.
      - run: npm run lint

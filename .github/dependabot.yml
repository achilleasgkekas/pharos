# Dependabot version updates. Security updates are enabled separately in the repo settings and
# open their own PRs as soon as an advisory lands; this file only schedules routine bumps.
#
# Grouped + capped on purpose: every PR costs a CI run and a Codex review, so a flood of
# one-line bumps would eat the weekly AI quota. Majors stay ungrouped so each one gets its own
# review (they are the ones that break things).
version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/Athens }
    open-pull-requests-limit: 2
    groups:
      web-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: npm
    directory: /apps/landing
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/Athens }
    open-pull-requests-limit: 1
    groups:
      landing-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: npm
    directory: /services/scraper
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups:
      scraper-all:
        patterns: ["*"]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies]

  - package-ecosystem: docker
    directories: [/apps/web, /apps/landing, /services/scraper]
    schedule: { interval: monthly }
    labels: [dependencies]
